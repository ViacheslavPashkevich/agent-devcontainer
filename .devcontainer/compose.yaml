services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Long-lived no-op main process: the container outlives any attaching
    # terminal. init reaps the zombies the process-heavy tooling leaves behind.
    #
    # Arming wraps it because this is the only hook that runs on *every* start —
    # `docker restart` and a daemon restart bypass the devcontainer lifecycle
    # hooks entirely, and devc's warm path never invokes them either. A failed
    # arm still starts the container so the operator can attach and debug. The
    # script installs a minimal deny before anything fallible runs, so every
    # failure past that first restore leaves egress *closed*, not open;
    # `devc firewall status` is the authority on what is actually enforced,
    # which is why the message below reports rather than asserts.
    command:
      - sh
      - -c
      - >-
        /usr/local/sbin/dev-firewall on
        || echo 'dev-firewall: arming failed — run `devc firewall status` to see what is enforced' >&2;
        exec sleep infinity
    init: true
    # iptables, ipset and dnsmasq's set feeding need NET_ADMIN; NET_RAW is
    # Docker's default but is named here so the fence's requirements are not
    # split between this file and the daemon's defaults.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # The project, at the fixed path every engine script assumes.
      - ..:/workspace
      # The dev home: logins, the operator tools, shell history. Survives
      # restarts, recreates and rebuilds.
      - home:/home/dev
      # --- project section: mounts -------------------------------------------
      #
      # Named volumes inside the workspace go in this list — a second
      # `volumes:` key lower down would be a duplicate YAML rejects. Each one
      # also needs its mount point in the Dockerfile and a line in
      # dev-own-volumes' VOLUMES. Shape:
      #
      # - node-modules:/workspace/node_modules
      #
      # --- end of project section --------------------------------------------
    # Gitignored, optional: a fresh clone boots without it (the doctor reports
    # the missing variables). `required` needs Docker Compose >= 2.24.
    env_file:
      - path: ./.env
        required: false
    # --- project section: the app service ----------------------------------
    #
    # Ports (loopback only, so nothing on the LAN reaches the dev servers),
    # environment, dependencies on the services below. Shape:
    #
    # ports:
    #   - "127.0.0.1:3000:3000"
    # environment:
    #   DATABASE_URL: postgres://postgres:postgres@postgres:5432
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    # shm_size: 2gb
    #
    # --- end of project section --------------------------------------------

  # --- project section: services ------------------------------------------
  #
  # Databases, caches, anything the app talks to. Service names resolve from
  # inside the container through the fence's resolver — the compose network is
  # a directly connected subnet, which the fence accepts. Shape:
  #
  # postgres:
  #   image: postgres:18
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   volumes:
  #     - pg-data:/var/lib/postgresql
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #
  # --- end of project section ---------------------------------------------

volumes:
  home:
  # --- project section: volumes -------------------------------------------
  # node-modules:
  # pg-data:
  # --- end of project section ---------------------------------------------
